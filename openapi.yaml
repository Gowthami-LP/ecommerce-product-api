openapi: 3.0.3
info:
	title: E-Commerce Product API
	version: 1.0.0

paths:
	/auth/register:
		post:
			tags:
				- Authentication
			summary: Register a new user
			requestBody:
				required: true
				content:
					application/json:
						schema:
							$ref: '#/components/schemas/RegisterRequest'
			responses:
				'201':
					description: User registered successfully
				'400':
					description: Invalid registration data
				'409':
					description: User already exists

	/auth/login:
		post:
			tags:
				- Authentication
			summary: Login user
			requestBody:
				required: true
				content:
					application/json:
						schema:
							$ref: '#/components/schemas/LoginRequest'
			responses:
				'200':
					description: Login successful
				'401':
					description: Invalid email or password

components:
	schemas:
		RegisterRequest:
			type: object
			required:
				- name
				- email
				- password
			properties:
				name:
					type: string
					minLength: 2
				email:
					type: string
					format: email
				password:
					type: string
					minLength: 6

		LoginRequest:
			type: object
			required:
				- email
				- password
			properties:
				email:
					type: string
					format: email
				password:
					type: string
					format: password
